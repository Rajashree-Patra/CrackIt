{% extends "base.html" %}

{% block title %}Login | CrackIt{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto;">
  <div class="card" style="padding: 3rem;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <div style="background: var(--accent-light); width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: var(--accent); margin: 0 auto 1.5rem;">
        <i data-lucide="shield-check" size="32"></i>
      </div>
      <h1 style="font-family: 'Fraunces'; font-size: 2rem; color: var(--primary);">Welcome Back</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Please enter your credentials to access your account.</p>
    </div>

    <form method="POST">
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Email Address</label>
        <div style="position: relative;">
          <i data-lucide="mail" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);" size="18"></i>
          <input type="email" name="email" required placeholder="name@university.edu" 
                 style="width: 100%; padding: 0.75rem 1rem 0.75rem 3rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
        </div>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Password</label>
        <div style="position: relative;">
          <i data-lucide="lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-muted);" size="18"></i>
          <input type="password" name="password" required placeholder="••••••••" 
                 style="width: 100%; padding: 0.75rem 1rem 0.75rem 3rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
        </div>
      </div>

      <div style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem; padding: 1rem; background: var(--bg); border-radius: 10px;">
        <label style="font-weight: 600; font-size: 0.85rem;">Login as:</label>
        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
          <input type="radio" name="role" value="student" checked> Student
        </label>
        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
          <input type="radio" name="role" value="admin"> Administrator
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">Sign In</button>
    </form>

    <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
      Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--accent); font-weight: 600; text-decoration: none;">Create one now</a>
    </p>
  </div>
</div>
{% endblock %}
