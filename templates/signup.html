{% extends "base.html" %}

{% block title %}Join CrackIt | National Exam Platform{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 2rem auto;">
  <div class="card" style="padding: 3rem;">
    <div style="text-align: center; margin-bottom: 2.5rem;">
      <h1 style="font-family: 'Fraunces'; font-size: 2.25rem; color: var(--primary);">Begin Your Journey</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem;">Join thousands of students preparing for national-level excellence.</p>
    </div>

    <form method="POST">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Full Name</label>
          <input type="text" name="name" required placeholder="John Doe" 
                 pattern="[A-Za-z ]+" title="Name should only contain letters and spaces"
                 style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
        </div>
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Email Address</label>
          <input type="email" name="email" required placeholder="john@example.com" 
                 style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
        </div>
      </div>

      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Password</label>
        <input type="password" name="password" required placeholder="Min 8 chars (A-z, 0-9, @#$)" 
               pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[\W_]).{8,}"
               title="Password must contain at least 8 characters, including uppercase, lowercase, numbers, and special characters"
               style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem;">
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Phone</label>
          <input type="text" name="phone" placeholder="8456841200"
                 pattern="[0-9]{10}" maxlength="10" title="Phone number must be exactly 10 digits"
                 style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
        </div>
        <div>
          <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">City</label>
          <input type="text" name="city" placeholder="New Delhi" 
                 style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit;">
        </div>
      </div>

      <div style="margin-bottom: 2rem;">
        <label style="display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem;">Primary Target Exam (Mandatory)</label>
        <select name="target_exam_id" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; background: white;">
          <option value="">Select your target exam...</option>
          {% for exam in exams %}
          <option value="{{ exam.exam_id }}">{{ exam.exam_name }} ({{ exam.exam_code }})</option>
          {% endfor %}
        </select>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">Create Account</button>
    </form>

    <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--accent); font-weight: 600; text-decoration: none;">Sign in here</a>
    </p>
  </div>
</div>
{% endblock %}
